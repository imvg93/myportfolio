
name: Deploy MyPortfolio to AWS ECS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: myportfolio-ecs-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: myportfolio
  ECS_CLUSTER: myportfolio-cluster
  ECS_SERVICE: myportfolio-task-service-gy9102vo
  TASK_DEFINITION_FAMILY: myportfolio-task
  CONTAINER_NAME: myportfolio

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::025988852986:role/GitHubActions-MyPortfolio-ECS-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Inspect task definition architecture
        id: task-def-info
        shell: bash
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

          CPU_ARCH=$(jq -r \
            '.runtimePlatform.cpuArchitecture // "X86_64"' \
            task-definition.json)

          echo "ECS task architecture: $CPU_ARCH"

          case "$CPU_ARCH" in
            ARM64)
              PLATFORM="linux/arm64"
              ;;
            X86_64)
              PLATFORM="linux/amd64"
              ;;
            *)
              echo "::error::Unsupported CPU architecture: $CPU_ARCH"
              exit 1
              ;;
          esac

          echo "docker-platform=$PLATFORM" >> "$GITHUB_OUTPUT"

          if ! jq -e --arg NAME "$CONTAINER_NAME" \
            '.containerDefinitions | any(.name == $NAME)' \
            task-definition.json >/dev/null; then
            echo "::error::Container $CONTAINER_NAME not found in task definition."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.task-def-info.outputs.docker-platform }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            NEXT_DEPLOYMENT_ID=${{ github.sha }}

      - name: Register updated ECS task definition
        id: task-def
        shell: bash
        env:
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail

          jq --arg IMAGE "$IMAGE_URI" --arg NAME "$CONTAINER_NAME" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            | .containerDefinitions |= map(
                if .name == $NAME then .image = $IMAGE else . end
              )
          ' task-definition.json > new-task-definition.json

          jq -e --arg NAME "$CONTAINER_NAME" \
            '.containerDefinitions | any(.name == $NAME)' \
            new-task-definition.json >/dev/null

          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered task definition: $TASK_DEF_ARN"
          echo "task-definition-arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Amazon ECS
        shell: bash
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-def.outputs.task-definition-arn }}" \
            --health-check-grace-period-seconds 120

      - name: Wait for ECS service stability
        shell: bash
        run: |
          set +e

          echo "Waiting for ECS service to stabilize..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::ECS service did not reach a stable state."

            echo "=== Current service status and events ==="
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,Pending:pendingCount,TaskDefinition:taskDefinition,Deployments:deployments[*].{Status:status,TaskDefinition:taskDefinition,Running:runningCount,Pending:pendingCount},Events:events[0:15].[createdAt,message]}' \
              --output json || true

            echo "=== Recent stopped task details ==="
            STOPPED_TASKS=$(aws ecs list-tasks \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --desired-status STOPPED \
              --max-results 10 \
              --query 'taskArns' \
              --output text 2>/dev/null || true)

            if [ -n "$STOPPED_TASKS" ] && [ "$STOPPED_TASKS" != "None" ]; then
              aws ecs describe-tasks \
                --cluster "$ECS_CLUSTER" \
                --tasks $STOPPED_TASKS \
                --query 'tasks[].{Task:taskArn,LastStatus:lastStatus,StopCode:stopCode,StoppedReason:stoppedReason,StartedAt:startedAt,StoppedAt:stoppedAt,Containers:containers[].{Name:name,ExitCode:exitCode,Reason:reason,Image:image}}' \
                --output json || true
            else
              echo "Stopped tasks could not be listed. Check IAM permissions or task history."
            fi

            exit "$STATUS"
          fi

          echo "ECS service reached a stable state."

      - name: Report deployed revision
        if: success()
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{Status:status,Desired:desiredCount,Running:runningCount,TaskDefinition:taskDefinition}' \
            --output table
